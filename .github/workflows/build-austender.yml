name: Build AusTender Combined Dataset

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Combine AusTender exports
        run: |
          python pipeline/combine_austender.py

      - name: Upload combined dataset
        uses: actions/upload-artifact@v4
        with:
          name: austender-combined
          path: |
            data/austender/combined/austender_combined.parquet
            audits/austender/
