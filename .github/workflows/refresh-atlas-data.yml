name: Build Defence Site

on:
  workflow_run:
    workflows:
      - "Refresh ATLAS Data"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD DEFENCE DASHBOARDS
  # ============================================================

  build-defence-site:
    name: Build Defence dashboards

    # Automatic runs only proceed when the upstream data refresh passed.
    # Manual workflow_dispatch runs are also allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    env:
      MASTER_PATH: defence/data/processed/master_defence_contracts.parquet
      SITE_DIR: docs
      DEFENCE_SITE_DIR: docs/defence

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow plotly openpyxl

      # ============================================================
      # DOWNLOAD DEFENCE MASTER
      # ============================================================

      - name: Download refreshed ATLAS data artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: atlas-data-refresh
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      # For a manual run, download the artifact from the most recent
      # successful Refresh ATLAS Data workflow.
      - name: Download latest successful ATLAS data artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "refresh-atlas-data.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Refresh ATLAS Data workflow found."
            exit 1
          fi

          echo "Using data refresh run: $RUN_ID"

          gh run download "$RUN_ID" \
            --name atlas-data-refresh \
            --dir .

      # ============================================================
      # VERIFY MASTER
      # ============================================================

      - name: Verify Defence master
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "defence/data/processed/master_defence_contracts.parquet"
          )

          if not path.exists():
              print("Files found under defence/data:")
              for item in Path("defence/data").rglob("*"):
                  if item.is_file():
                      print(" -", item)

              raise SystemExit(
                  f"Defence master not found: {path}"
              )

          df = pd.read_parquet(path)

          print()
          print("Defence dashboard master")
          print("------------------------")
          print(f"Rows:    {len(df):,}")
          print(f"Columns: {len(df.columns):,}")

          if len(df) == 0:
              raise SystemExit(
                  "Defence master contains zero rows."
              )

          required = [
              "supplier_group",
              "Service Offering",
              "Domain",
          ]

          missing = [
              col
              for col in required
              if col not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "Defence master missing dashboard columns: "
                  + ", ".join(missing)
              )

          print()
          print("Defence master validation: PASS")
          PY

      # ============================================================
      # PREPARE SITE
      # ============================================================

      - name: Prepare Defence site directory
        run: |
          mkdir -p "$DEFENCE_SITE_DIR"

          echo "Existing docs structure:"
          find docs -maxdepth 2 -type f | sort || true

      # ============================================================
      # TAM OVERVIEW
      # ============================================================

      - name: Build TAM Overview
        run: |
          python defence/dashboards/DefenceTAM.py \
            --input "$MASTER_PATH" \
            --output-dir "$DEFENCE_SITE_DIR" \
            --value-mode total

      # ============================================================
      # COMPETITIVE INTELLIGENCE
      # ============================================================

      - name: Build Competitive Intelligence
        run: |
          python defence/dashboards/CompetitiveIntelligence.py \
            --input "$MASTER_PATH" \
            --output-dir "$DEFENCE_SITE_DIR"

      # ============================================================
      # CONTRACT EXPLORER
      # ============================================================

      - name: Build Contract Explorer
        run: |
          python defence/dashboards/ContractExplorer.py \
            --input "$MASTER_PATH" \
            --output-dir "$DEFENCE_SITE_DIR" \
            --value-mode total

      # ============================================================
      # SERVICE OFFERING GROWTH
      # ============================================================

      - name: Build Service Offering Growth
        run: |
          python defence/dashboards/ServiceOfferingGrowth.py \
            --input "$MASTER_PATH" \
            --output-dir "$DEFENCE_SITE_DIR" \
            --value-mode total

      # ============================================================
      # VERIFY DASHBOARD OUTPUTS
      # ============================================================

      - name: Inspect generated Defence dashboards
        run: |
          echo
          echo "===================================="
          echo "GENERATED DEFENCE SITE FILES"
          echo "===================================="

          find "$DEFENCE_SITE_DIR" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "HTML files:"

          HTML_COUNT=$(find "$DEFENCE_SITE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            | wc -l)

          echo "$HTML_COUNT"

          if [ "$HTML_COUNT" -lt 4 ]; then
            echo "Expected at least four Defence dashboard HTML files."
            exit 1
          fi

      # ============================================================
      # SITE VALIDATION
      # ============================================================

      - name: Validate ATLAS site
        run: |
          python - <<'PY'
          from pathlib import Path

          docs = Path("docs")
          defence = docs / "defence"

          if not docs.exists():
              raise SystemExit(
                  "docs/ directory does not exist."
              )

          if not (docs / "index.html").exists():
              raise SystemExit(
                  "Main ATLAS landing page is missing: "
                  "docs/index.html"
              )

          if not defence.exists():
              raise SystemExit(
                  "Defence site directory is missing."
              )

          html_files = sorted(
              defence.glob("*.html")
          )

          print()
          print("Defence HTML outputs")
          print("--------------------")

          for path in html_files:
              print(
                  f"{path.name}: "
                  f"{path.stat().st_size / 1024:,.1f} KB"
              )

          if len(html_files) < 4:
              raise SystemExit(
                  "Fewer than four Defence HTML files were generated."
              )

          print()
          print("ATLAS site validation: PASS")
          PY

      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Defence site build summary
        run: |
          echo
          echo "===================================="
          echo "DEFENCE SITE BUILD COMPLETE"
          echo "===================================="
          echo
          echo "Master:"
          echo "$MASTER_PATH"
          echo
          echo "Dashboard source scripts:"
          echo " - DefenceTAM.py"
          echo " - CompetitiveIntelligence.py"
          echo " - ContractExplorer.py"
          echo " - ServiceOfferingGrowth.py"
          echo
          echo "Published site source:"
          echo "$SITE_DIR"
          echo
          echo "===================================="

      # ============================================================
      # PAGES ARTIFACT
      # ============================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy-defence-site:
    name: Deploy ATLAS site
    needs:
      - build-defence-site

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
