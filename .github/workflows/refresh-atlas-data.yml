name: Refresh ATLAS Data

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/austender/monthly/*.csv"
      - "pipeline/combine_financial_year_analysis.py"
      - "defence/filter_defence.py"
      - "defence/build_master.py"
      - "defence/config/**"
      - "health/filter_health.py"
      - "health/config/**"
      - ".github/workflows/refresh-atlas-data.yml"

permissions:
  contents: read

jobs:
  refresh-atlas-data:
    name: Build ATLAS datasets
    runs-on: ubuntu-latest

    env:
      BASELINE_PATH: data/austender/baseline/austender_baseline.parquet
      MONTHLY_DIR: data/austender/monthly

      COMBINED_PATH: data/austender/combined/austender_combined.parquet

      DEFENCE_RAW_PATH: defence/data/defence_contracts_raw.parquet
      HEALTH_RAW_PATH: health/data/health_contracts_raw.parquet

      DEFENCE_PROCESSED_DIR: defence/data/processed
      DEFENCE_MASTER_PATH: defence/data/processed/master_defence_contracts.parquet

      DEFENCE_DOMAIN_LOOKUP: defence/config/defence_domain_lookup.csv
      DEFENCE_SUPPLIER_MAPPING: defence/config/supplier_mapping.xlsx

      AUDIT_ROOT: audits/austender

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow openpyxl

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Create pipeline directories
        run: |
          mkdir -p data/austender/baseline
          mkdir -p data/austender/combined

          mkdir -p defence/data
          mkdir -p defence/data/processed

          mkdir -p health/data

          mkdir -p audits/austender/combined
          mkdir -p audits/austender/defence
          mkdir -p audits/austender/health

      # ============================================================
      # HISTORICAL BASELINE
      # ============================================================

      - name: Download historical baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download atlas-data \
            --pattern "austender_baseline.parquet" \
            --dir data/austender/baseline \
            --clobber

      - name: Verify historical baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/austender/baseline/austender_baseline.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Baseline parquet not found: {path}"
              )

          df = pd.read_parquet(path)

          print("Historical baseline")
          print("-------------------")
          print(f"Rows:    {len(df):,}")
          print(f"Columns: {len(df.columns):,}")
          print(f"Path:    {path}")

          if len(df) == 0:
              raise SystemExit(
                  "Historical baseline contains zero rows."
              )

          if "03. Contract Notice ID" not in df.columns:
              raise SystemExit(
                  "Historical baseline is missing "
                  "'03. Contract Notice ID'."
              )

          print("Baseline validation: PASS")
          PY

      # ============================================================
      # MONTHLY INPUTS
      # ============================================================

      - name: Inspect monthly FYA inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          monthly_dir = Path(
              "data/austender/monthly"
          )

          files = sorted(
              monthly_dir.glob(
                  "financial_year_analysis_*.csv"
              )
          )

          print(
              "Monthly Financial Year Analysis files"
          )
          print(
              "-------------------------------------"
          )

          if not files:
              raise SystemExit(
                  "No canonical monthly FYA CSV files found."
              )

          required = {
              "01. Agency Name",
              "02. Contract Type",
              "03. Contract Notice ID",
              "15. Category Type",
              "29. Supplier Name",
              "35. Agency Division",
              "36. Agency Branch",
              "48. Value",
          }

          for path in files:

              df = pd.read_csv(
                  path,
                  dtype=str,
                  low_memory=False,
                  encoding="utf-8-sig",
              )

              print(
                  f"{path.name}: "
                  f"{len(df):,} rows, "
                  f"{len(df.columns)} columns"
              )

              if len(df.columns) != 48:
                  raise SystemExit(
                      f"{path.name}: expected 48 columns, "
                      f"got {len(df.columns)}."
                  )

              missing = sorted(
                  required - set(df.columns)
              )

              if missing:
                  raise SystemExit(
                      f"{path.name}: missing columns: "
                      + ", ".join(missing)
                  )

          print()
          print(
              "Monthly input validation: PASS"
          )
          PY

      # ============================================================
      # COMBINE
      # ============================================================

      - name: Build canonical AusTender dataset
        run: |
          python pipeline/combine_financial_year_analysis.py \
            --baseline "$BASELINE_PATH" \
            --monthly-dir "$MONTHLY_DIR" \
            --output "$COMBINED_PATH" \
            --audit-dir "$AUDIT_ROOT/combined"

      # ============================================================
      # VALIDATE COMBINED
      # ============================================================

      - name: Validate canonical AusTender dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/austender/combined/austender_combined.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Combined parquet not created: {path}"
              )

          df = pd.read_parquet(path)

          print()
          print("ATLAS combined dataset")
          print("----------------------")
          print(f"Rows:    {len(df):,}")
          print(f"Columns: {len(df.columns):,}")

          required = {
              "01. Agency Name",
              "02. Contract Type",
              "03. Contract Notice ID",
              "15. Category Type",
              "29. Supplier Name",
              "35. Agency Division",
              "36. Agency Branch",
              "48. Value",
          }

          missing = sorted(
              required - set(df.columns)
          )

          if missing:
              raise SystemExit(
                  "Combined dataset missing columns: "
                  + ", ".join(missing)
              )

          if len(df) == 0:
              raise SystemExit(
                  "Combined dataset contains zero rows."
              )

          print(
              "Combined dataset validation: PASS"
          )
          PY

      # ============================================================
      # DEFENCE RAW
      # ============================================================

      - name: Build Defence raw market
        run: |
          python defence/filter_defence.py \
            --input "$COMBINED_PATH" \
            --output "$DEFENCE_RAW_PATH" \
            --audit-dir "$AUDIT_ROOT/defence"

      - name: Validate Defence raw market
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "defence/data/defence_contracts_raw.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Defence parquet not created: {path}"
              )

          df = pd.read_parquet(path)

          print()
          print("Defence raw market")
          print("------------------")
          print(f"Rows: {len(df):,}")

          if len(df) == 0:
              raise SystemExit(
                  "Defence filter produced zero rows."
              )

          print(
              "Defence raw validation: PASS"
          )
          PY

      # ============================================================
      # HEALTH RAW
      # ============================================================

      - name: Build Health raw market
        run: |
          python health/filter_health.py \
            --input "$COMBINED_PATH" \
            --output "$HEALTH_RAW_PATH" \
            --audit-dir "$AUDIT_ROOT/health"

      - name: Validate Health raw market
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "health/data/health_contracts_raw.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Health parquet not created: {path}"
              )

          df = pd.read_parquet(path)

          print()
          print("Health raw market")
          print("-----------------")
          print(f"Rows: {len(df):,}")

          if len(df) == 0:
              raise SystemExit(
                  "Health filter produced zero rows."
              )

          print(
              "Health raw validation: PASS"
          )
          PY

      # ============================================================
      # DEFENCE CONFIG
      # ============================================================

      - name: Validate Defence master config
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path(
                  "defence/config/defence_domain_lookup.csv"
              ),
              Path(
                  "defence/config/supplier_mapping.xlsx"
              ),
          ]

          for path in required:

              if not path.exists():
                  raise SystemExit(
                      f"Missing Defence config file: {path}"
                  )

              print(
                  f"Found: {path}"
              )

          print(
              "Defence master config validation: PASS"
          )
          PY

      # ============================================================
      # DEFENCE MASTER
      # ============================================================

      - name: Build Defence classified master
        run: |
          python defence/build_master.py \
            --input "$DEFENCE_RAW_PATH" \
            --output-dir "$DEFENCE_PROCESSED_DIR" \
            --domain-lookup "$DEFENCE_DOMAIN_LOOKUP" \
            --supplier-mapping "$DEFENCE_SUPPLIER_MAPPING"

      # ============================================================
      # VALIDATE DEFENCE MASTER
      # ============================================================

      - name: Validate Defence classified master
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "defence/data/processed/master_defence_contracts.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Defence master not created: {path}"
              )

          df = pd.read_parquet(path)

          print()
          print("Defence classified master")
          print("-------------------------")
          print(f"Rows:    {len(df):,}")
          print(f"Columns: {len(df.columns):,}")

          if len(df) == 0:
              raise SystemExit(
                  "Defence master contains zero rows."
              )

          important = [
              "supplier_group",
              "Service Offering",
              "Domain",
          ]

          print()
          print(
              "Key enrichment columns:"
          )

          for column in important:

              if column in df.columns:

                  populated = int(
                      df[column]
                      .notna()
                      .sum()
                  )

                  print(
                      f"  {column}: "
                      f"{populated:,} populated"
                  )

              else:

                  print(
                      f"  {column}: NOT PRESENT"
                  )

          print()
          print(
              "Defence master validation: PASS"
          )
          PY

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: ATLAS data summary
        run: |
          python - <<'PY'
          import pandas as pd

          combined = pd.read_parquet(
              "data/austender/combined/austender_combined.parquet"
          )

          defence = pd.read_parquet(
              "defence/data/defence_contracts_raw.parquet"
          )

          health = pd.read_parquet(
              "health/data/health_contracts_raw.parquet"
          )

          defence_master = pd.read_parquet(
              "defence/data/processed/master_defence_contracts.parquet"
          )

          print()
          print(
              "===================================="
          )
          print(
              "ATLAS DATA REFRESH COMPLETE"
          )
          print(
              "===================================="
          )
          print(
              f"Combined:       "
              f"{len(combined):,} rows"
          )
          print(
              f"Defence raw:    "
              f"{len(defence):,} rows"
          )
          print(
              f"Health raw:     "
              f"{len(health):,} rows"
          )
          print(
              f"Defence master: "
              f"{len(defence_master):,} rows"
          )
          print(
              "===================================="
          )
          PY

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload refreshed ATLAS datasets
        uses: actions/upload-artifact@v4
        with:
          name: atlas-data-refresh
          retention-days: 7
          if-no-files-found: error
          path: |
            data/austender/combined/austender_combined.parquet
            defence/data/defence_contracts_raw.parquet
            defence/data/processed/**
            health/data/health_contracts_raw.parquet
            audits/austender/combined/**
            audits/austender/defence/**
            audits/austender/health/**
