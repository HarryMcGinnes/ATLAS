
name: Test ATLAS Bronze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bronze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Download baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/austender/baseline
          gh release download atlas-data \
            --pattern "austender_baseline.parquet" \
            --dir data/austender/baseline

      - name: Build Bronze
        run: |
          python atlas/bronze/ingest.py \
            --baseline data/austender/baseline/austender_baseline.parquet \
            --monthly-dir data/austender/monthly

      - name: Validate Bronze
        run: python atlas/bronze/validate.py

      - name: Build Silver Core
        run: |
          python atlas/silver/core/normalise.py \
            --bronze-dir data/bronze/austender \
            --output data/silver/core/austender_contracts.parquet

      - name: Verify Silver Core
        run: |
          python - <<'PY'
          import pandas as pd

          path = "data/silver/core/austender_contracts.parquet"
          df = pd.read_parquet(path)

          assert len(df) > 0, "Silver Core is empty"
          assert df["CN ID"].notna().any()
          assert "supplier_group" in df.columns

          print(f"Silver Core PASS: {len(df):,} rows")
          PY

      - name: Build Defence Silver Industry
        run: |
          python atlas/silver/industry/defence/classify.py \
            --input data/silver/core/austender_contracts.parquet \
            --output data/silver/industry/defence/defence_contracts.parquet

      - name: Validate Defence Silver Industry
        run: |
          python - <<'PY'
          import pandas as pd

          path = "data/silver/industry/defence/defence_contracts.parquet"
          df = pd.read_parquet(path)

          assert len(df) > 0, "Defence dataset is empty"
          assert df["is_defence_scope"].all()
          assert df["CN ID"].is_unique, "Duplicate contract IDs"
          assert df["supplier_group"].notna().all()

          print(f"Defence Silver PASS: {len(df):,} contracts")
          print(f"Total value: A${df['Value'].sum()/1e9:,.3f}B")
          PY

      - name: Reconcile Defence datasets
        run: |
          python defence/filter_defence.py \
            --input data/silver/core/austender_contracts.parquet \
            --output data/legacy_defence.parquet \
            --audit-dir audits/legacy_defence

          python atlas/silver/core/reconcile.py \
            --old data/legacy_defence.parquet \
            --new data/silver/industry/defence/defence_contracts.parquet

      - name: Build legacy dataset for comparison
        run: |
          python pipeline/combine_financial_year_analysis.py \
            --baseline data/austender/baseline/austender_baseline.parquet \
            --monthly-dir data/austender/monthly \
            --output data/austender/combined/austender_combined.parquet \
            --audit-dir audits/austender/combined

      - name: Reconcile Silver Core
        run: |
          python atlas/silver/core/reconcile.py \
            --old data/austender/combined/austender_combined.parquet \
            --new data/silver/core/austender_contracts.parquet


      - name: Upload ATLAS datasets
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pipeline-test
          retention-days: 7
          if-no-files-found: error
          path: |
            data/bronze/austender/
            data/silver/core/
            audits/silver/core/

