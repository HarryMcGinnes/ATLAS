
name: Test ATLAS Bronze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bronze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow pyyaml

      # ---------------------------------------------------------
      # BRONZE
      # ---------------------------------------------------------

      - name: Download baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/austender/baseline
          gh release download atlas-data \
            --pattern "austender_baseline.parquet" \
            --dir data/austender/baseline

      - name: Build Bronze
        run: |
          python atlas/bronze/ingest.py \
            --baseline data/austender/baseline/austender_baseline.parquet \
            --monthly-dir data/austender/monthly

      - name: Validate Bronze
        run: python atlas/bronze/validate.py

      # ---------------------------------------------------------
      # SILVER CORE
      # ---------------------------------------------------------

      - name: Build Silver Core
        run: |
          python atlas/silver/core/normalise.py \
            --bronze-dir data/bronze/austender \
            --output data/silver/core/austender_contracts.parquet

      - name: Verify Silver Core
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet(
              "data/silver/core/austender_contracts.parquet"
          )

          assert len(df) > 0, "Silver Core is empty"
          assert df["CN ID"].notna().any()
          assert "supplier_group" in df.columns
          assert "is_accenture" in df.columns

          print(f"Silver Core PASS: {len(df):,} rows")
          PY

      # ---------------------------------------------------------
      # DEFENCE SILVER INDUSTRY
      # ---------------------------------------------------------

      - name: Build Defence Silver Industry
        run: |
          python atlas/silver/industry/defence/classify.py \
            --input data/silver/core/austender_contracts.parquet \
            --output data/silver/industry/defence/defence_contracts.parquet

      - name: Validate Defence Silver Industry
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet(
              "data/silver/industry/defence/defence_contracts.parquet"
          )

          assert len(df) > 0, "Defence dataset is empty"
          assert df["is_defence_scope"].all()
          assert df["CN ID"].is_unique, "Duplicate contract IDs"
          assert df["supplier_group"].notna().all()

          print(f"Defence Silver PASS: {len(df):,} contracts")
          print(f"Total value: A${df['Value'].sum()/1e9:,.3f}B")
          PY

      # ---------------------------------------------------------
      # DEFENCE DOMAINS
      # ---------------------------------------------------------

      - name: Build Defence Domains
        run: |
          python atlas/silver/industry/defence/domains.py \
            --input data/silver/industry/defence/defence_contracts.parquet \
            --lookup defence/config/defence_domain_lookup.csv \
            --output data/silver/industry/defence/defence_enriched.parquet

      - name: Validate Defence Domains
        run: |
          python - <<'PY'
          import pandas as pd

          source = pd.read_parquet(
              "data/silver/industry/defence/defence_contracts.parquet"
          )
          df = pd.read_parquet(
              "data/silver/industry/defence/defence_enriched.parquet"
          )

          assert len(df) == len(source), "Defence row count changed"
          assert "defence_domain" in df.columns
          assert df["defence_domain"].notna().all()
          assert df["CN ID"].is_unique

          print("Defence domain validation: PASS")
          print(df["defence_domain"].value_counts().to_string())
          PY

      # ---------------------------------------------------------
      # DEFENCE GOLD - ORIGINAL POC CLASSIFIER
      # ---------------------------------------------------------

      - name: Check POC classifier syntax
        run: |
          python -m py_compile \
            atlas/gold/defence/poc_classifier.py \
            atlas/gold/defence/classify.py

      - name: Test Defence Gold POC Classifier
        run: |
          python atlas/gold/defence/classify.py \
            --input data/silver/industry/defence/defence_enriched.parquet \
            --output data/gold/defence/defence_classified.parquet

      - name: Validate Defence Gold POC
        run: |
          python - <<'PY'
          import pandas as pd

          silver = pd.read_parquet(
              "data/silver/industry/defence/defence_enriched.parquet"
          )
          gold = pd.read_parquet(
              "data/gold/defence/defence_classified.parquet"
          )

          assert len(gold) == len(silver), "Gold row count changed"
          assert gold["CN ID"].is_unique, "Duplicate contract IDs"

          silver_value = pd.to_numeric(
              silver["Value"], errors="coerce"
          ).fillna(0).sum()

          gold_value = pd.to_numeric(
              gold["Value"], errors="coerce"
          ).fillna(0).sum()

          assert abs(silver_value - gold_value) < 0.01, (
              "Gold changed total Defence value"
          )

          required = [
              "service_offering",
              "is_addressable",
              "supplier_group",
              "defence_domain",
              "ReinventionPartner",
              "ReinventionEngine",
          ]

          missing = [c for c in required if c not in gold.columns]
          assert not missing, f"Missing Gold columns: {missing}"

          assert gold["is_addressable"].notna().all()
          assert gold["service_offering"].notna().all()

          addressable = gold[
              gold["is_addressable"].astype(bool)
          ]

          print()
          print("ATLAS DEFENCE GOLD - POC VALIDATION")
          print("=" * 55)
          print(f"Total contracts: {len(gold):,}")
          print(f"Total Defence value: A${gold_value/1e9:,.3f}B")
          print(
              f"Addressable contracts: "
              f"{len(addressable):,}"
          )
          print(
              f"Addressable TAM: "
              f"A${addressable['Value'].sum()/1e9:,.3f}B"
          )

          acc = addressable[
              addressable["is_accenture"].astype(bool)
          ]

          print(f"Accenture contracts: {len(acc):,}")
          print(f"Accenture wins: A${acc['Value'].sum()/1e9:,.3f}B")

          print()
          print("ADDRESSABLE SERVICE OFFERINGS")
          print("=" * 55)

          summary = (
              addressable.groupby("service_offering")["Value"]
              .agg(["count", "sum"])
              .sort_values("sum", ascending=False)
          )

          summary["value_bn"] = summary["sum"] / 1e9
          print(summary[["count", "value_bn"]].to_string())

          print()
          print("DEFENCE GOLD VALIDATION: PASS")
          PY

      # ---------------------------------------------------------
      # HEALTH SILVER INDUSTRY
      # ---------------------------------------------------------

      - name: Build Health Silver Industry
        run: |
          python atlas/silver/industry/health/classify.py \
            --input data/silver/core/austender_contracts.parquet \
            --agency-config health/config/health_agencies.txt \
            --aliases config/health/agency_aliases.csv \
            --output data/silver/industry/health/health_contracts.parquet

      - name: Validate Health Silver Industry
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet(
              "data/silver/industry/health/health_contracts.parquet"
          )

          assert len(df) > 0, "Health dataset is empty"
          assert df["CN ID"].is_unique, "Duplicate contract IDs"
          assert df["supplier_group"].notna().all()
          assert df["is_health_scope"].all()

          print("Health Silver validation: PASS")
          print(f"Contracts: {len(df):,}")
          print(f"Value: A${df['Value'].sum()/1e9:,.3f}B")
          print(f"Accenture rows: {df['is_accenture'].sum():,}")
          PY

      # ---------------------------------------------------------
      # RECONCILIATION
      # ---------------------------------------------------------

      - name: Reconcile Health datasets
        run: |
          python health/filter_health.py \
            --input data/silver/core/austender_contracts.parquet \
            --agency-config health/config/health_agencies.txt \
            --output data/legacy_health.parquet \
            --audit-dir audits/legacy_health

          python atlas/silver/core/reconcile.py \
            --old data/legacy_health.parquet \
            --new data/silver/industry/health/health_contracts.parquet

      - name: Reconcile Defence datasets
        run: |
          python defence/filter_defence.py \
            --input data/silver/core/austender_contracts.parquet \
            --output data/legacy_defence.parquet \
            --audit-dir audits/legacy_defence

          python atlas/silver/core/reconcile.py \
            --old data/legacy_defence.parquet \
            --new data/silver/industry/defence/defence_contracts.parquet

      - name: Build legacy dataset for comparison
        run: |
          python pipeline/combine_financial_year_analysis.py \
            --baseline data/austender/baseline/austender_baseline.parquet \
            --monthly-dir data/austender/monthly \
            --output data/austender/combined/austender_combined.parquet \
            --audit-dir audits/austender/combined

      - name: Reconcile Silver Core
        run: |
          python atlas/silver/core/reconcile.py \
            --old data/austender/combined/austender_combined.parquet \
            --new data/silver/core/austender_contracts.parquet

      # ---------------------------------------------------------
      # ARTIFACTS
      # ---------------------------------------------------------

      - name: Upload ATLAS datasets
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pipeline-test
          retention-days: 7
          if-no-files-found: error
          path: |
            data/bronze/austender/
            data/silver/core/
            audits/silver/core/
            data/silver/industry/defence/
            data/silver/industry/health/
            data/gold/defence/

      - name: Upload Defence Gold Summary
        uses: actions/upload-artifact@v4
        with:
          name: defence-gold-only
          retention-days: 7
          if-no-files-found: error
          path: data/gold/defence/defence_classified.parquet
