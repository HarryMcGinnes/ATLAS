          print(f"Contracts: {len(df):,}")
          print(f"Value: A${df['Value'].sum()/1e9:,.3f}B")
          print(f"Accenture rows: {df['is_accenture'].sum():,}")
          PY

      # ---------------------------------------------------------
      # HEALTH GOLD - ORIGINAL TAMBI CLASSIFIER
      # ---------------------------------------------------------

      - name: Check Health POC classifier syntax
        run: |
          python -m py_compile \
            atlas/gold/health/poc_classifier.py \
            atlas/gold/health/classify.py

      - name: Build Health Gold
        run: |
          python atlas/gold/health/classify.py \
            --input data/silver/industry/health/health_contracts.parquet \
            --output data/gold/health/health_classified.parquet \
            --audit-dir audits/gold/health

      - name: Validate Health Gold
        run: |
          python - <<'PYCODE'
          import pandas as pd

          silver = pd.read_parquet(
              "data/silver/industry/health/health_contracts.parquet"
          )
          gold = pd.read_parquet(
              "data/gold/health/health_classified.parquet"
          )

          assert len(gold) == len(silver), "Health row count changed"
          assert gold["CN ID"].is_unique, "Duplicate Health CN IDs"
          assert abs(gold["Value"].sum() - silver["Value"].sum()) < 0.01, (
              "Health procurement value changed"
          )

          acc = gold["is_accenture"].fillna(False).astype(bool)
          addr = gold["is_addressable"].fillna(False).astype(bool)

          assert not (acc & ~addr).any(), "Accenture wins excluded from Health TAM"
          assert not ((~addr) & gold["service_offering"].notna()).any(), (
              "Non-addressable contract assigned Service Offering"
          )

          print("HEALTH GOLD VALIDATION: PASS")
          print(f"Contracts: {len(gold):,}")
          print(f"Addressable: {addr.sum():,}")
          print(f"Addressable TAM: A${gold.loc[addr, 'Value'].sum()/1e9:,.3f}B")
          print(f"Accenture wins: A${gold.loc[acc, 'Value'].sum()/1e9:,.3f}B")
          print(gold.loc[addr, "service_offering"].fillna("Unresolved").value_counts().to_string())
          PYCODE

      # ---------------------------------------------------------
      # RECONCILIATION
      # ---------------------------------------------------------

      - name: Reconcile Health datasets
        run: |
          python health/filter_health.py \
            --input data/silver/core/austender_contracts.parquet \
            --agency-config health/config/health_agencies.txt \
            --output data/legacy_health.parquet \
            --audit-dir audits/legacy_health

          python atlas/silver/core/reconcile.py \
            --old data/legacy_health.parquet \
            --new data/silver/industry/health/health_contracts.parquet

      - name: Reconcile Defence datasets
        run: |
          python defence/filter_defence.py \
            --input data/silver/core/austender_contracts.parquet \
            --output data/legacy_defence.parquet \
            --audit-dir audits/legacy_defence

          python atlas/silver/core/reconcile.py \
            --old data/legacy_defence.parquet \
            --new data/silver/industry/defence/defence_contracts.parquet

      - name: Build legacy dataset for comparison
        run: |
          python pipeline/combine_financial_year_analysis.py \
            --baseline data/austender/baseline/austender_baseline.parquet \
            --monthly-dir data/austender/monthly \
            --output data/austender/combined/austender_combined.parquet \
            --audit-dir audits/austender/combined

      - name: Reconcile Silver Core
        run: |
          python atlas/silver/core/reconcile.py \
            --old data/austender/combined/austender_combined.parquet \
            --new data/silver/core/austender_contracts.parquet

      # ---------------------------------------------------------
      # ARTIFACTS
      # ---------------------------------------------------------

      - name: Upload ATLAS datasets
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pipeline-test
          retention-days: 7
          if-no-files-found: error
          path: |
            data/bronze/austender/
            data/silver/core/
            audits/silver/core/
            data/silver/industry/defence/
            data/silver/industry/health/
            data/gold/defence/
            data/gold/health/
            audits/gold/health/

      - name: Upload Defence Gold Summary
        uses: actions/upload-artifact@v4
        with:
          name: defence-gold-only
          retention-days: 7
          if-no-files-found: error
          path: data/gold/defence/defence_classified.parquet
