name: Test Defence Master

on:
  workflow_dispatch:

  push:
    paths:
      - "defence/build_master.py"
      - "defence/config/**"
      - ".github/workflows/test-defence-master.yml"

permissions:
  contents: read

jobs:
  test-defence-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download current Defence raw dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p defence/data
          gh release download atlas-data-latest \
            --pattern "defence_contracts_raw.parquet" \
            --dir defence/data \
            --clobber

          test -f defence/data/defence_contracts_raw.parquet
          ls -lh defence/data/defence_contracts_raw.parquet

      - name: Compile Defence master builder
        run: |
          python -m py_compile defence/build_master.py

      - name: Run Defence classifier regression suite
        run: |
          python - <<'PY'
          import importlib.util

          path = "defence/build_master.py"
          spec = importlib.util.spec_from_file_location("defence_build_master", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          module.run_regression_checks()
          print("Defence classifier regression checks: PASS")
          PY

      - name: Build Defence classified master
        run: |
          python defence/build_master.py

      - name: Validate master output
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("defence/data/processed/master_defence_contracts.parquet")
          if not path.exists():
              raise SystemExit(f"Missing expected master output: {path}")

          df = pd.read_parquet(path)

          required = {
              "Agency",
              "CN ID",
              "Value",
              "Financial Year",
              "Value Per Year",
              "supplier_group",
              "is_accenture",
              "is_addressable",
              "capability",
              "service_offering",
              "ReinventionPartner",
              "ReinventionEngine",
              "defence_domain",
              "Agency Divison",
              "Agency Branch",
          }

          missing = sorted(required - set(df.columns))
          if missing:
              raise SystemExit(
                  "Master output is missing dashboard-required columns: "
                  + ", ".join(missing)
              )

          if df.empty:
              raise SystemExit("Master output contains zero rows.")

          cn = df["CN ID"].fillna("").astype(str).str.strip()
          if not cn.eq("").any() and cn.duplicated().any():
              print(
                  "Warning: repeated CN IDs are present. "
                  "This may be valid only if the upstream canonical source contains them."
              )

          print("Defence master output validation: PASS")
          print(f"Rows: {len(df):,}")
          print(f"Columns: {len(df.columns):,}")
          print(f"Defence value: ${pd.to_numeric(df['Value'], errors='coerce').fillna(0).sum()/1e9:,.2f}B")
          print(f"Addressable rows: {df['is_addressable'].fillna(False).astype(bool).sum():,}")
          print(
              "Addressable value: "
              f"${pd.to_numeric(df.loc[df['is_addressable'].fillna(False).astype(bool), 'Value'], errors='coerce').fillna(0).sum()/1e9:,.2f}B"
          )
          PY

      - name: Upload preflight diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: defence-master-preflight
          retention-days: 7
          path: |
            defence/data/processed/build_summary.json
            defence/data/processed/audit/
