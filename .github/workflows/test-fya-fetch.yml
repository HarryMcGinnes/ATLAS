name: Test FYA Fetch

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to fetch"
        required: true
        default: "2026"

      month:
        description: "Month to fetch"
        required: true
        default: "9"

  push:
    paths:
      - "pipeline/fetch_financial_year_analysis.py"
      - ".github/workflows/test-fya-fetch.yml"

permissions:
  contents: read

jobs:
  test-fya-fetch:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas
          python -m playwright install --with-deps chromium

      - name: Fetch Financial Year Analysis export
        run: |
          python pipeline/fetch_financial_year_analysis.py \
            --year "${{ github.event.inputs.year || '2026' }}" \
            --month "${{ github.event.inputs.month || '9' }}"

      - name: Validate downloaded export
        run: |
          python - <<'PY'

          from pathlib import Path
          import pandas as pd

          files = sorted(
              Path(
                  "data/austender/monthly"
              ).glob(
                  "financial_year_analysis_*.csv"
              )
          )

          if not files:
              raise SystemExit(
                  "No FYA CSV downloaded."
              )

          path = files[-1]

          df = pd.read_csv(
              path,
              dtype=str,
              low_memory=False,
              encoding="utf-8-sig",
          )

          print(
              f"Downloaded: {path}"
          )

          print(
              f"Rows: {len(df):,}"
          )

          print(
              f"Columns: {len(df.columns)}"
          )

          required = {
              "03. Contract Notice ID",
              "15. Category Type",
              "35. Agency Division",
              "36. Agency Branch",
              "48. Value",
          }

          missing = sorted(
              required
              - set(df.columns)
          )

          if missing:
              raise SystemExit(
                  "Missing required columns: "
                  + ", ".join(missing)
              )

          if len(df.columns) != 48:
              raise SystemExit(
                  f"Expected 48 columns, "
                  f"got {len(df.columns)}."
              )

          print(
              "FYA fetch validation: PASS"
          )

          PY

      - name: Upload fetch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fya-fetch-test
          retention-days: 7
          path: |
            data/austender/monthly/financial_year_analysis_*.csv
            audits/austender/fetch_diagnostics/
