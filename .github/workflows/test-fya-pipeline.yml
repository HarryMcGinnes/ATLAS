name: Test FYA Pipeline

on:
  workflow_dispatch:

  push:
    paths:
      - "pipeline/combine_financial_year_analysis.py"
      - "data/austender/monthly/**"
      - ".github/workflows/test-fya-pipeline.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  test-fya-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download historical FYA baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/austender/baseline

          gh release download atlas-data \
            --pattern "austender_baseline.parquet" \
            --dir data/austender/baseline \
            --clobber

          test -f data/austender/baseline/austender_baseline.parquet
          ls -lh data/austender/baseline/austender_baseline.parquet

      - name: Compile combine script
        run: |
          python -m py_compile pipeline/combine_financial_year_analysis.py

      - name: Combine baseline and monthly FYA exports
        run: |
          python pipeline/combine_financial_year_analysis.py

      - name: Validate combined dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/austender/combined/austender_combined.parquet"
          )

          if not path.exists():
              raise SystemExit(
                  f"Combined parquet was not created: {path}"
              )

          df = pd.read_parquet(path)

          required = {
              "Agency",
              "CN ID",
              "Supplier Name",
              "Description",
              "Category",
              "Category Type",
              "Agency Division",
              "Agency Branch",
              "Publish Date",
              "Start Date",
              "End Date",
              "Value",
              "Financial Year",
              "Value Per Year",
              "CN Root ID",
          }

          missing = sorted(required - set(df.columns))

          if missing:
              raise SystemExit(
                  "Combined dataset is missing required fields: "
                  + ", ".join(missing)
              )

          cn = (
              df["CN Root ID"]
              .fillna("")
              .astype(str)
              .str.strip()
          )

          duplicate_roots = int(
              cn[cn.ne("")].duplicated().sum()
          )

          if duplicate_roots:
              raise SystemExit(
                  f"{duplicate_roots:,} duplicate CN roots remain."
              )

          divisions = int(
              df["Agency Division"]
              .fillna("")
              .astype(str)
              .str.strip()
              .ne("")
              .sum()
          )

          branches = int(
              df["Agency Branch"]
              .fillna("")
              .astype(str)
              .str.strip()
              .ne("")
              .sum()
          )

          category_types = int(
              df["Category Type"]
              .fillna("")
              .astype(str)
              .str.strip()
              .ne("")
              .sum()
          )

          if divisions == 0:
              raise SystemExit(
                  "Agency Division is completely empty."
              )

          if branches == 0:
              raise SystemExit(
                  "Agency Branch is completely empty."
              )

          if category_types == 0:
              raise SystemExit(
                  "Category Type is completely empty."
              )

          print("FYA combined dataset validation: PASS")
          print(f"Rows: {len(df):,}")
          print(f"Columns: {len(df.columns):,}")
          print(
              f"Unique CN roots: "
              f"{cn.replace('', pd.NA).nunique():,}"
          )
          print(
              f"Division populated: {divisions:,}"
          )
          print(
              f"Branch populated: {branches:,}"
          )
          print(
              f"Category Type populated: {category_types:,}"
          )
          print(
              "Total value: "
              f"${pd.to_numeric(df['Value'], errors='coerce').fillna(0).sum():,.2f}"
          )
          PY

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fya-pipeline-test
          retention-days: 7
          path: |
            audits/austender/
