
service_offerings:
  - id: STA
    name: "Strategy, Transformation & Advisory"

    rules:
      - field: "Description"
        pattern: '\b(?:strategy|strategic advisory|business advisory)\b'
        weight: 15
        reason: "Strategy or advisory services"

      - field: "Description"
        pattern: '\b(?:business transformation|operating model|change management)\b'
        weight: 15
        reason: "Business transformation"

      - field: "Description"
        pattern: '\b(?:feasibility study|business case|options analysis)\b'
        weight: 15
        reason: "Feasibility or business case"

      - field: "Description"
        pattern: '\b(?:project management|program management|pmo)\b'
        weight: 12
        reason: "Project or program management"
        
      - field: "Category"
        pattern: '\b(?:management advisory|strategic planning consultation|project management|project administration or planning|feasibility studies)\b'
        weight: 14
        reason: "Strategy/advisory procurement category"


  - id: SIE
    name: "SI & Engineering"

    rules:
      - field: "Description"
        pattern: '\b(?:systems? integration|platform integration|application integration)\b'
