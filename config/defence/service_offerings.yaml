        weight: 17
        reason: "Software or application development"

      - field: "Description"
        pattern: '\b(?:devops|devsecops|digital engineering|systems engineering)\b'
        weight: 14
        reason: "Digital or systems engineering"

        
      - field: "Description"
        pattern: '^(?:software|software services?)$'
        weight: 14
        reason: "Explicit software procurement"


      - field: "Description"
        pattern: '\b(?:erp implementation|sap implementation|platform implementation)\b'
        weight: 16
        reason: "Enterprise platform implementation"
        
      - field: "Category"
        pattern: '\b(?:software development|application implementation|systems? integration)\b'
        weight: 17
        reason: "Software development or systems integration category"

      - field: "Category"
        pattern: '\b(?:software or hardware engineering|enterprise software)\b'
