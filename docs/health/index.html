<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATLAS | Health Market Intelligence</title>
  <style>
    :root{--bg:#f5f5f6;--panel:#fff;--text:#111827;--muted:#5d6675;--line:#dedfe3;--black:#050505}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{background:var(--black);color:#fff;padding:18px 22px}.brand{font-size:34px;font-weight:800;letter-spacing:.04em}.tag{font-size:15px;margin-top:2px}
    .wrap{max-width:1040px;margin:0 auto;padding:64px 28px}
    .back{display:inline-block;margin-bottom:26px;color:#475467;text-decoration:none;font-size:14px}
    h1{font-size:40px;margin:0 0 8px}.lead{color:var(--muted);font-size:17px;line-height:1.5}
    .panel{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px}
    .panel h2{margin:0 0 10px}.panel p{margin:0;color:var(--muted);line-height:1.55}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">ATLAS</div><div class="tag">Addressable Market Intelligence</div></header>
  <main class="wrap">
    <a class="back" href="../">← All markets</a>
    <h1>Health Market Intelligence</h1>
    <p class="lead">Australian Government Health procurement intelligence.</p>
    <section class="panel">
      <h2>Dashboards coming next</h2>
      <p>The Health data pipeline is available. Dashboard pages will appear here as the Health classification and visualisation layer is completed.</p>
    </section>
  </main>
</body>
</html>
